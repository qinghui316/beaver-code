name: Windows desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'qinghui316/beaver-code'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $env:BEAVER_RELEASE_TAG = '${{ github.ref_name }}'
          $env:BEAVER_RELEASE_COMMIT = (git rev-parse HEAD).Trim()
          node scripts/verify-desktop-release-input.mjs
      - run: npm ci
      - run: node scripts/print-release-body.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:desktop-boundaries
      - run: npm run lint:provider-boundaries
      - run: npm run lint:frontend-boundaries
      - run: npm run lint:ui-language
      - run: npm run lint:ui-styles
      - run: npm run test:ci

  internal:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'qinghui316/beaver-code'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:desktop:win
        env:
          BEAVER_BUILD_CHANNEL: internal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beaver-code-windows-internal
          if-no-files-found: error
          path: release/desktop/internal/*.exe

  release-draft:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'qinghui316/beaver-code'
    needs: verify
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify release tag is unused
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This release tag already exists and cannot be replaced.' }
          exit 0
      - run: npm ci
      - name: Build and independently sign stable update
        run: npm run package:desktop:win
        env:
          BEAVER_BUILD_CHANNEL: stable
          BEAVER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.BEAVER_UPDATE_SIGNING_PRIVATE_KEY }}
          BEAVER_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.BEAVER_UPDATE_SIGNING_KEY_PASSWORD }}
          BEAVER_UPDATE_SIGNING_KEY_ID: ${{ vars.BEAVER_UPDATE_SIGNING_KEY_ID }}
      - name: Create verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release/desktop/stable -File | Where-Object {
            $_.Name -match '\.exe$|\.exe\.blockmap$|^latest\.yml$|^beaver-update-win-x64\.json(?:\.sig)?$|^beaver-release-notes\.json(?:\.sig)?$|^release-receipt\.json$|^SHA256SUMS\.txt$'
          }
          if ($assets.Count -ne 9) { throw 'Stable release assets are incomplete.' }
          $commit = (git rev-parse HEAD).Trim()
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft --verify-tag `
            --target $commit --title 'Beaver Code ${{ github.ref_name }}' --notes-file release/desktop/release-body.md @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          $release = gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json body | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.body.TrimEnd() -ne (Get-Content -LiteralPath release/desktop/release-body.md -Raw -Encoding UTF8).TrimEnd()) {
            throw 'Draft release notes differ from the authored source.'
          }
      - name: Re-download and verify the draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BEAVER_BUILD_CHANNEL: stable
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'beaver-release-verification'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download '${{ github.ref_name }}' --repo '${{ github.repository }}' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Draft release download failed.' }
          $env:DESKTOP_RELEASE_DIR = $download
          node scripts/verify-update-release.mjs
          $publishedAssets = @(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          $expectedNames = (@($publishedAssets | Sort-Object) -join ',')
          $actualNames = (@((Get-ChildItem -LiteralPath $download -File).Name | Sort-Object) -join ',')
          if ($LASTEXITCODE -ne 0 -or $publishedAssets.Count -ne 9 -or $expectedNames -ne $actualNames) {
            throw 'Draft release asset set is invalid.'
          }
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'qinghui316/beaver-code'
    needs: release-draft
    runs-on: windows-latest
    environment: windows-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build release verifier from the approved source
        run: npm run build
      - name: Re-download and verify the approved draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BEAVER_BUILD_CHANNEL: stable
          RELEASE_ENABLED: ${{ vars.BEAVER_RELEASE_ENABLED }}
        run: |
          if ($env:RELEASE_ENABLED -ne 'true') { throw 'Stable Beaver Code releases are not enabled.' }
          $download = Join-Path $env:RUNNER_TEMP 'beaver-approved-release-verification'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download '${{ github.ref_name }}' --repo '${{ github.repository }}' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Approved draft release download failed.' }
          $env:DESKTOP_RELEASE_DIR = $download
          node scripts/verify-update-release.mjs
          $release = gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json body | ConvertFrom-Json
          $expectedBody = node scripts/print-release-body.mjs
          if ($LASTEXITCODE -ne 0 -or $release.body.TrimEnd() -ne (@($expectedBody) -join "`n").TrimEnd()) {
            throw 'Approved draft release notes differ from the authored source.'
          }
          $publishedAssets = @(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          $expectedNames = (@($publishedAssets | Sort-Object) -join ',')
          $actualNames = (@((Get-ChildItem -LiteralPath $download -File).Name | Sort-Object) -join ',')
          if ($LASTEXITCODE -ne 0 -or $publishedAssets.Count -ne 9 -or $expectedNames -ne $actualNames) {
            throw 'Approved draft release asset set is invalid.'
          }
      - name: Publish immutable latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
